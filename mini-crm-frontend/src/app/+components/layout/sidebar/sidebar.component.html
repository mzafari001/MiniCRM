<aside class="w-64 bg-white border-l border-slate-200 min-h-screen flex flex-col justify-between py-6 px-4 shrink-0">
  <div class="space-y-6">
    <!-- برند و عنوان نرم‌افزار -->
    <div class="flex items-center gap-3 px-2">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-200">
        CRM
      </div>
      <div>
        <h2 class="text-base font-extrabold text-slate-800 leading-tight">مینی CRM</h2>
        <span class="text-xs text-slate-400">نسخه ۱.۰</span>
      </div>
    </div>

    <!-- منوهای ناوبری -->
    <nav class="space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-600 font-bold border-indigo-600"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-50 transition-colors">

          <!-- آیکون داشبورد -->
          @if (item.icon === 'dashboard') {
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
          }

          <!-- آیکون مشتریان -->
          @if (item.icon === 'users') {
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
          }

          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- بخش پایین سایدبار: وضعیت ارتباط سیستم -->
  <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl flex items-center gap-3">
    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
    <span class="text-xs text-slate-500">دیتابیس متصل است</span>
  </div>
</aside>
