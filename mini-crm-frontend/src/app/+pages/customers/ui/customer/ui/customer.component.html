<div class="customer-card">
  <h2>جزئیات و ویرایش مشتری</h2>

  @if (isLoading) {
    <p class="loading">در حال بارگذاری اطلاعات مشتری...</p>
  } @else {

    @if (errorMessage) {
      <div class="alert error">{{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="alert success">{{ successMessage }}</div>
    }

    <form (ngSubmit)="onSave()">
      <div class="form-group">
        <label>شناسه مشتری:</label>
        <input type="text" [value]="customer.id" disabled />
      </div>

      <div class="form-group">
        <label>نام و نام خانوادگی:</label>
        <input type="text" [(ngModel)]="customer.fullName" name="fullName" required />
      </div>

      <div class="form-group">
        <label>ایمیل:</label>
        <input type="email" [(ngModel)]="customer.email" name="email" required />
      </div>

      <div class="form-group">
        <label>شماره تماس:</label>
        <input type="text" [(ngModel)]="customer.phone" name="phoneNumber" />
      </div>

      <div class="actions">
        <button type="submit" [disabled]="isSaving">
          {{ isSaving ? 'در حال ذخیره...' : 'ذخیره تغییرات' }}
        </button>
        <button type="button" class="btn-cancel" (click)="goBack()">بازگشت</button>
      </div>
    </form>
  }
</div>
